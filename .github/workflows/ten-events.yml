name: Student journal checks
on:
  push:
    branches: [ten-event-student-journal]
  pull_request:
    paths: ['ten-events/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ten-events
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
